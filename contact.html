<section class="rfq-flow-system">
    <div class="rfq-bg-layer" style="background-image: url('resources/backgrounds/FRQ-BG.webp');"></div>

    <div class="container-fluid rfq-content-inner">
        <div class="rfq-side-info">
            <h2 class="system-title" data-translate="contact-rfq-title">快速询价</h2>
            <div class="response-tag">
                <span class="pulse-dot"></span> 
                <span data-translate="contact-rfq-response">2小时极速反馈</span>
            </div>
        </div>

        <form class="rfq-console-bar">
            <div class="console-item">
                <div class="item-body">
                    <label data-translate="contact-rfq-label-name">如何称呼您？</label>
                    <input type="text" placeholder="姓名或公司名称 *" required data-translate-placeholder="contact-rfq-placeholder-name">
                </div>
            </div>

            <div class="console-item">
                <div class="item-body">
                    <label data-translate="contact-rfq-label-contact">如何联系您？</label>
                    <input type="text" placeholder="手机、邮箱或微信号 *" required data-translate-placeholder="contact-rfq-placeholder-contact">
                </div>
            </div>

            <div class="console-item flex-main">
                <div class="item-body">
                    <label data-translate="contact-rfq-label-needs">您的需求信息是？</label>
                    <input type="text" placeholder="型号、品牌、数量及封装要求... *" required data-translate-placeholder="contact-rfq-placeholder-needs">
                </div>
            </div>

            <button type="submit" class="console-submit" data-translate="contact-rfq-submit">获取报价单</button>
        </form>
    </div>
</section>
